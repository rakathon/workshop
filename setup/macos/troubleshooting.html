<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Troubleshooting — macOS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:        #7c3aed;
      --primary-dark:   #5b21b6;
      --primary-light:  #a855f7;
      --accent:         #ec4899;
      --warning:        #d97706;
      --warning-bg:     #1c1507;
      --warning-border: #92400e;
      --bg:             #0a0f1e;
      --surface:        #1a1f35;
      --surface-light:  #252b42;
      --surface-border: #2d3450;
      --text:           #f8fafc;
      --text-muted:     #94a3b8;
      --code-bg:        #151929;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
    }

    .page { max-width: 760px; margin: 0 auto; }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 40px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary-light); }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 56px; }

    header .badge {
      display: inline-block;
      background: linear-gradient(135deg, #92400e, var(--warning));
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      background: linear-gradient(135deg, #fcd34d, #f59e0b, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    header p {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── Issue accordion ── */
    .issues { display: flex; flex-direction: column; gap: 24px; }

    .issue {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: box-shadow 0.2s ease;
    }
    .issue:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--warning-border); }

    .issue-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 32px;
      cursor: pointer;
      user-select: none;
    }

    .issue-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #92400e, var(--warning));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .issue-title { flex: 1; min-width: 0; }
    .issue-title h2 {
      font-size: 17px;
      font-weight: 700;
      color: #fcd34d;
      margin-bottom: 3px;
    }
    .issue-title p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .issue-chevron {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    .issue.collapsed .issue-chevron { transform: rotate(-90deg); }

    /* ── Issue body ── */
    .issue-body {
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      max-height: 4000px;
      opacity: 1;
    }
    .issue.collapsed .issue-body { max-height: 0; opacity: 0; }

    .issue-body-inner {
      padding: 0 32px 32px;
      border-top: 1px solid var(--surface-border);
    }

    /* ── Symptom screenshot ── */
    .symptom-wrap {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin: 24px 0;
    }
    .symptom-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: block;
      margin: 0 auto;
    }
    .symptom-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 12px;
    }

    /* ── Fix steps ── */
    .fix-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .steps { display: flex; flex-direction: column; gap: 24px; }

    .step {
      background: var(--surface-light);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 28px 32px;
      transition: box-shadow 0.2s ease;
    }
    .step:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 0 1px var(--primary-dark); }

    .step-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
    }
    .step-header:hover .step-heading { color: var(--primary-light); }

    .step-number {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      transition: background 0.2s ease;
    }

    .step-text { flex: 1; }
    .step-heading {
      font-size: 17px;
      font-weight: 650;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.2px;
      transition: color 0.2s;
    }
    .step-summary { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    .step-chevron {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    .step.collapsed .step-chevron { transform: rotate(-90deg); }

    .step-body {
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease;
      max-height: 1400px;
      opacity: 1;
    }
    .step.collapsed .step-body { max-height: 0; opacity: 0; }

    .step.collapsed { padding-bottom: 20px; }
    .step.collapsed .step-number { background: linear-gradient(135deg, #374151, #4b5563); }
    .step.completed .step-number { background: linear-gradient(135deg, #065f46, #10b981); }

    .step-description {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .step-description strong { color: var(--text); font-weight: 600; }

    p strong { color: var(--text); font-weight: 600; }

    /* ── Tip ── */
    .tip {
      background: var(--code-bg);
      border-left: 3px solid var(--primary);
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .tip strong { color: var(--primary-light); font-weight: 600; }

    /* ── Screenshot ── */
    .screenshot-wrap {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .screenshot-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 1px var(--surface-border);
      display: block;
      margin: 0 auto;
    }

    /* ── Connector ── */
    .connector {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 16px;
    }
    .connector::before {
      content: "";
      display: block;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, var(--surface-border), var(--surface-light));
      border-radius: 1px;
    }

    /* ── Buttons ── */
    .btn-next {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 9px 22px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-next:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn-next:active { transform: translateY(0); }

    /* ── Footer ── */
    footer {
      text-align: center;
      margin-top: 56px;
      font-size: 14px;
      color: var(--text-muted);
    }
    footer a { color: var(--primary-light); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      body { padding: 32px 16px; }
      header h1 { font-size: 26px; }
      .issue-header { padding: 20px; }
      .issue-body-inner { padding: 0 20px 24px; }
      .step { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="page">

  <a class="back-link" href="../index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to Setup Guide
  </a>

  <header>
    <div class="badge">Troubleshooting — macOS</div>
    <h1>Fix Common<br>Setup Issues</h1>
    <p>Step-by-step fixes for issues you may encounter when setting up Claude on macOS.</p>
  </header>

  <div id="issues-container" class="issues"></div>

  <footer>
    <p>Still stuck? Contact your IT administrator or return to the <a href="../index.html">Setup Guide</a>.</p>
  </footer>

</div>

<script>
  // ─────────────────────────────────────────────────────────────
  // ISSUES DATA
  // To add a new issue, append an object to this array.
  // ─────────────────────────────────────────────────────────────
  const ISSUES = [
    {
      id: 'network-vpn',
      title: "Can't reach api.ai.public.rakuten-it.com",
      description: 'A network warning appears about the provider not responding.',
      symptomImage: 'check-network-vpn.png',
      symptomAlt: "Warning: Can't reach api.ai.public.rakuten-it.com — The provider didn't respond",
      doneLabel: 'Got it',
      steps: [
        {
          title: 'Ignore this warning — it is expected',
          summary: 'This message is harmless and will not block normal usage.',
          body: 'This warning appears because Claude checks a Rakuten-internal endpoint that is not reachable from all networks. <strong>It does not affect Claude\'s functionality</strong> — you can dismiss the message and continue using Claude normally. No action is required.',
          tip: 'If Claude itself is not working (e.g. responses are failing), check that you are connected to the <strong>Rakuten VPN</strong>. But the warning alone is not a sign of a problem.',
          image: 'check-network-vpn.png',
          imageAlt: 'The warning message — safe to dismiss',
        },
      ],
    },
    // Add more issues here, e.g.:
    // {
    //   id: 'another-issue',
    //   title: 'Another error title',
    //   description: 'Short description visible in the collapsed header.',
    //   symptomImage: 'another-issue.png',
    //   symptomAlt: 'Screenshot of the error',
    //   doneLabel: 'Done',
    //   steps: [ ... ],
    // },
  ];

  // ─────────────────────────────────────────────────────────────
  // RENDERER — no edits needed below when adding issues
  // ─────────────────────────────────────────────────────────────
  const chevronSVG = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function renderStep(issueId, step, index, total) {
    const stepId = `${issueId}-step-${index}`;
    const isFirst = index === 1;
    const isLast  = index === total;
    const tipHTML = step.tip
      ? `<div class="tip"><strong>Tip:</strong> ${step.tip}</div>`
      : '';
    const btnLabel = isLast
      ? `&#10003; ${escapeHTML(ISSUES.find(i => i.id === issueId).doneLabel)}`
      : 'Next &rarr;';
    const btnHandler = isLast
      ? `finishIssue('${issueId}')`
      : `nextStep('${issueId}', ${index}, ${total})`;

    return `
      ${index > 1 ? '<div class="connector"></div>' : ''}
      <div class="step${isFirst ? '' : ' collapsed'}" id="${stepId}">
        <div class="step-header" onclick="toggleStep('${stepId}')">
          <div class="step-number">${index}</div>
          <div class="step-text">
            <div class="step-heading">${escapeHTML(step.title)}</div>
            <div class="step-summary">${escapeHTML(step.summary)}</div>
          </div>
          <div class="step-chevron">${chevronSVG}</div>
        </div>
        <div class="step-body">
          <div class="step-description">${step.body}</div>
          ${tipHTML}
          <div class="screenshot-wrap">
            <img src="${step.image}" alt="${escapeHTML(step.imageAlt)}" />
          </div>
          <button class="btn-next" onclick="${btnHandler}">${btnLabel}</button>
        </div>
      </div>`;
  }

  function renderIssue(issue) {
    const stepsHTML = issue.steps
      .map((s, i) => renderStep(issue.id, s, i + 1, issue.steps.length))
      .join('');

    return `
      <div class="issue collapsed" id="issue-${issue.id}">
        <div class="issue-header" onclick="toggleIssue('${issue.id}')">
          <div class="issue-icon">⚠</div>
          <div class="issue-title">
            <h2>${escapeHTML(issue.title)}</h2>
            <p>${escapeHTML(issue.description)}</p>
          </div>
          <div class="issue-chevron">${chevronSVG}</div>
        </div>
        <div class="issue-body">
          <div class="issue-body-inner">
            <div class="symptom-wrap">
              <div class="symptom-label">What you see</div>
              <img src="${issue.symptomImage}" alt="${escapeHTML(issue.symptomAlt)}" />
            </div>
            <div class="fix-label">How to fix it — ${issue.steps.length} step${issue.steps.length !== 1 ? 's' : ''}</div>
            <div class="steps">${stepsHTML}</div>
            <div id="issue-${issue.id}-done" style="display:none; margin-top:20px; font-size:14px; color:#6ee7b7;">
              &#10003; All done! You can safely dismiss the warning and continue using Claude.
            </div>
          </div>
        </div>
      </div>`;
  }

  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('issues-container').innerHTML = ISSUES.map(renderIssue).join('');

  // ── Interaction handlers ──
  function toggleIssue(id) {
    document.getElementById(`issue-${id}`).classList.toggle('collapsed');
  }

  function toggleStep(stepId) {
    document.getElementById(stepId).classList.toggle('collapsed');
  }

  function nextStep(issueId, current, total) {
    const currentEl = document.getElementById(`${issueId}-step-${current}`);
    currentEl.classList.add('completed', 'collapsed');

    if (current < total) {
      const nextEl = document.getElementById(`${issueId}-step-${current + 1}`);
      nextEl.classList.remove('collapsed');
      nextEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function finishIssue(issueId) {
    const issue = ISSUES.find(i => i.id === issueId);
    const lastEl = document.getElementById(`${issueId}-step-${issue.steps.length}`);
    lastEl.classList.add('completed', 'collapsed');
    const doneEl = document.getElementById(`issue-${issueId}-done`);
    doneEl.style.display = 'block';
    doneEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
</script>
</body>
</html>
