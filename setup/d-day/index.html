<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to the Summit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #7c3aed;
      --primary-dark:  #5b21b6;
      --primary-light: #a855f7;
      --accent:        #ec4899;
      --bg:            #0a0f1e;
      --surface:       #1a1f35;
      --border:        #2d3450;
      --text:          #f8fafc;
      --muted:         #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #c4b5fd, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 56px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 48px;
      width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .card.mac {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 0 24px rgba(124,58,237,0.2);
    }

    .card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px var(--primary);
      border-color: var(--primary);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon svg { width: 48px; height: 48px; }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      width: 100%;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
    }

    @media (max-width: 620px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Rakuten AI · CoWork</div>
    <h1>Welcome to the Summit</h1>
    <p class="subtitle">Download and run the setup for your operating system to get started.</p>
  </header>

  <div class="cards">

    <!-- macOS -->
    <div class="card mac">
      <div class="card-icon">
        <!-- Apple logo SVG -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M33.2 7.6c-1.6 1.9-4.2 3.4-6.7 3.2-.3-2.6 1-5.3 2.5-7C30.6 1.9 33.3.4 35.6.2c.3 2.7-.8 5.4-2.4 7.4z" fill="#f8fafc"/>
          <path d="M35.5 11.5c-3.7-.2-6.9 2.1-8.7 2.1-1.8 0-4.6-2-7.6-1.9-3.9.1-7.5 2.3-9.5 5.8-4.1 7-.1 17.3 2.9 23 1.5 2.3 3.3 4.8 5.7 4.7 2.3-.1 3.1-1.5 5.9-1.5 2.7 0 3.5 1.5 5.9 1.4 2.4 0 4-2.3 5.5-4.6 1.7-2.6 2.4-5.1 2.5-5.2-.1 0-4.8-1.8-4.8-7.2 0-4.5 3.7-6.6 3.9-6.8-2.1-3.1-5.4-3.7-6.7-3.8z" fill="#f8fafc"/>
        </svg>
      </div>
      <h2>macOS</h2>
      <a class="btn" href="../setup.dmg" download="setup.dmg">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v9M4 8l4 4 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 14h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        Download for Mac
      </a>
    </div>

    <!-- Windows -->
    <div class="card">
      <div class="card-icon">
        <!-- Windows logo SVG -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9.6L21.3 7.2V23H4V9.6z" fill="#00adef"/>
          <path d="M23.3 6.9L44 4v19H23.3V6.9z" fill="#00adef"/>
          <path d="M4 25h17.3v15.8L4 38.4V25z" fill="#00adef"/>
          <path d="M23.3 25H44v19l-20.7-2.9V25z" fill="#00adef"/>
        </svg>
      </div>
      <h2>Windows</h2>
      <a class="btn" href="../setup.ps1" download="setup.ps1">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v9M4 8l4 4 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 14h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        Download for Windows
      </a>
    </div>

  </div>

  <footer>🌿 &copy; Platform Engineering 🌿</footer>

</body>
</html>
