<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to the Summit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #7c3aed;
      --primary-dark:  #5b21b6;
      --primary-light: #a855f7;
      --accent:        #ec4899;
      --bg:            #0a0f1e;
      --surface:       #1a1f35;
      --border:        #2d3450;
      --text:          #f8fafc;
      --muted:         #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #c4b5fd, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 56px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 40px;
      width: 260px;
      text-align: center;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .card-icon {
      font-size: 2.4rem;
      margin-bottom: 16px;
      display: block;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    footer {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
    }

    @media (max-width: 520px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Rakuten AI · CoWork</div>
    <h1>Welcome to the Summit</h1>
    <p class="subtitle">Download and run the setup for your operating system to get started.</p>
  </header>

  <div class="cards">
    <div class="card">
      <span class="card-icon"></span>
      <h2>macOS</h2>
      <a class="btn" href="../setup.dmg" download="setup.dmg">&#8659;&nbsp; Download for Mac</a>
    </div>
    <div class="card">
      <span class="card-icon">🪟</span>
      <h2>Windows</h2>
      <a class="btn" href="../setup.ps1" download="setup.ps1">&#8659;&nbsp; Download for Windows</a>
    </div>
  </div>

  <footer>🌿 Copyright Platform Engineering 🌿</footer>

</body>
</html>
